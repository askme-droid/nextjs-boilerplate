# Keeps the directory's synced fd.sg listings current: every 6 hours it asks
# the live site to copy fd.sg's latest view counts (and import new listings).
# Setup: repo Settings → Secrets and variables → Actions → New repository
# secret: CRON_SECRET (same value as the site's CRON_SECRET setting).
# Can also be run by hand: Actions tab → "Sync from fd.sg" → Run workflow.
name: Sync from fd.sg

on:
  schedule:
    - cron: "7 */6 * * *" # every 6 hours (UTC), at :07
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the sync on the live site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://directories.fd.sg' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          # A run imports at most 20 new listings; repeat while more are pending.
          for i in 1 2 3 4 5; do
            body=$(curl -sS --fail-with-body -m 300 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/fdsg-sync")
            echo "$body"
            remaining=$(echo "$body" | jq -r '.remaining // 0')
            [ "$remaining" -gt 0 ] || break
          done
